<style>
:root{--bg:#F7F2EA;--card:#fff;--ink:#2A2320;--soft:#6B5F57;--line:#E9DFD2;--brand:#C2410C;--brand-soft:#FBDCC8}
@media (prefers-color-scheme:dark){:root{--bg:#1B1714;--card:#231E1A;--ink:#F5EEE6;--soft:#B3A69A;--line:#3A3029;--brand:#FB923C;--brand-soft:#5A2A12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
header{padding:28px 0 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;font-size:22px;letter-spacing:-.01em}
nav.lang{margin-left:auto;display:flex;gap:6px}
nav.lang a{color:var(--soft);text-decoration:none;font-size:14px;font-weight:600;padding:6px 10px;border-radius:999px}
nav.lang a[aria-current]{background:var(--brand-soft);color:var(--ink)}
main{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:36px clamp(20px,5vw,48px);margin:16px 0 24px}
h1{font-size:clamp(28px,5vw,36px);line-height:1.2;letter-spacing:-.015em;margin:0 0 6px}
.updated{color:var(--soft);font-size:15px;margin:0 0 24px}
h2{font-size:19px;margin:28px 0 6px}
p{margin:0 0 14px}
ul{margin:0 0 14px;padding-left:22px}
li{margin:4px 0}
a{color:var(--brand)}
.docs{display:grid;gap:12px;margin-top:20px}
.docs a{display:block;padding:18px 20px;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ink);font-weight:700}
.docs a:hover{border-color:var(--brand)}
footer{color:var(--soft);font-size:14px;padding:0 0 40px;display:flex;gap:16px;flex-wrap:wrap}
footer a{color:var(--soft)}
</style>
</head>

</div>

</html>
